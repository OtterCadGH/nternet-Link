; nternet-Link V4 firmware
; Targets:
;   - xiao-s3      : Seeed XIAO ESP32S3 Sense-style build (current dev hardware)
;   - nlink-pcb    : Custom nternet-Link V4 PCB (ESP32-S3-WROOM-1)
;   - xiao-c3-lite : Legacy V2 adapter (no camera), text/chat only

[platformio]
default_envs = xiao-s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DNLINK_FW_VERSION=\"4.0.0-dev\"
    -DCORE_DEBUG_LEVEL=1

[esp32s3_common]
platform = espressif32
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DNLINK_HAS_CAMERA=1
    -DNLINK_HAS_NATIVE_USB=1
lib_deps =
    ${env.lib_deps}
    ; OV5640 autofocus helper (same lib used in V3)
    https://github.com/0015/ESP32-OV5640-AF.git

[env:xiao-s3]
extends = esp32s3_common
build_flags =
    ${esp32s3_common.build_flags}
    -DNLINK_BOARD_XIAO_S3=1

[env:nlink-pcb]
extends = esp32s3_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3_common.build_flags}
    -DNLINK_BOARD_CUSTOM_PCB=1

[env:xiao-c3-lite]
platform = espressif32
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DNLINK_HAS_CAMERA=0
    -DNLINK_BOARD_XIAO_C3=1

; --- Custom-board production targets ----------------------------------------
; nlink-cam : ESP32-S3-PICO-1 SiP + OV5640 camera + microSD (full stick)
[env:nlink-cam]
extends = esp32s3_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3_common.build_flags}
    -DNLINK_BOARD_CAM_PICO=1

; nlink-lite : ESP32-C3-MINI-1, chat only — no camera, no SD (stealth)
[env:nlink-lite]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DNLINK_HAS_CAMERA=0
    -DNLINK_HAS_SD=0
    -DNLINK_BOARD_LITE_C3=1
